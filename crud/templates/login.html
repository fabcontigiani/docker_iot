{% extends "layout.html" %}
{% block body %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h4 class="card-title text-center mb-4">Iniciar Sesión</h4>
                        <form method="POST" action="{{url_for('login')}}">
                            <div class="mb-3">
                                <input autofocus name="usuario" placeholder="Usuario" type="text" class="form-control">
                            </div>
                            <div class="mb-3">
                                <input name="password" placeholder="Contraseña" type="password" class="form-control">
                            </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <button type="submit" class="btn btn-primary">Aceptar</button>
                                <a href="{{url_for('registrar')}}">Registrarse</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
